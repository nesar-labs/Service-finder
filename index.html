      'West Bengal':{'Kolkata':[22.5726,88.3639],'Howrah':[22.5958,88.2636],'Durgapur':[23.5204,87.3119],'Siliguri':[26.7271,88.3953],'Asansol':[23.6739,86.9524]},

    const specialties={Doctor:['Family physician','Dermatologist','Pediatrician','Physiotherapist','General physician'],Engineer:['Civil engineer','Computer repair','Structural engineer','Home automation','Mechanical engineer'],Plumber:['Pipe repair','Bathroom fitting','Water heater expert','Leak detection','Kitchen plumbing'],Electrician:['Wiring specialist','Lighting expert','Appliance repair','Solar technician','Safety inspection'],Tutor:['Mathematics tutor','English coach','Science tutor','Coding instructor','Exam preparation']};
    const categoryIcons={Doctor:'✚',Engineer:'⌘',Plumber:'♧',Electrician:'ϟ',Tutor:'▤'};
    let db=readStore(), currentUser=null, activeCategory='Doctor', professionals=[], selectedId=null, map=null, markers=[], routeLine=null, homeMarker=null, pendingCoords=null;
    const app=document.getElementById('app');
    function readStore(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{users:[],session:null,favorites:[],searches:[]}}catch{return{users:[],session:null,favorites:[],searches:[]}}}
    function saveStore(){localStorage.setItem(STORE_KEY,JSON.stringify(db))}
    function escapeHtml(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function toast(message,type='success'){const root=document.getElementById('toast-root');const el=document.createElement('div');const color=type==='error'?'border-rose-400':type==='info'?'border-blue-400':'border-emerald-400';el.className=`toast-in flex items-center gap-3 rounded-2xl border-l-4 ${color} bg-white px-4 py-3 shadow-xl shadow-slate-900/10 text-sm font-semibold text-slate-700`;el.innerHTML=`<span class="text-lg">${type==='error'?'⚠':type==='info'?'i':'✓'}</span><span>${escapeHtml(message)}</span>`;root.append(el);setTimeout(()=>el.remove(),3400)}
    function icon(name,cls=''){const glyph={pin:'⌖',search:'⌕',heart:'♡',star:'★',arrow:'↗',clock:'◷',shield:'◈',home:'⌂',chevron:'⌄',user:'◉'}[name]||'•';return `<span class="${cls}" aria-hidden="true">${glyph}</span>`}
    function getProfessionals(category,city){const center=homeCoords();const salt=`${city}-${category}-${Date.now()}-${Math.random()}`;return Array.from({length:12},(_,i)=>{const angle=Math.random()*Math.PI*2;const km=0.35+Math.random()*4.65;const lat=center[0]+Math.cos(angle)*km/111;const lng=center[1]+Math.sin(angle)*km/(111*Math.max(.15,Math.cos(center[0]*Math.PI/180)));const name=firstNames[Math.floor(Math.random()*firstNames.length)]+' '+surnames[Math.floor(Math.random()*surnames.length)];const rating=(4.2+Math.random()*.8).toFixed(1);return{id:`${salt}-${i}`,name,category,specialty:specialties[category][Math.floor(Math.random()*specialties[category].length)],rating,reviews:24+Math.floor(Math.random()*480),distance:km.toFixed(1),price:category==='Doctor'?`₹${400+Math.floor(Math.random()*900)}`:`₹${250+Math.floor(Math.random()*1400)}`,coords:[lat,lng],initials:name.split(' ').map(x=>x[0]).join(''),available:Math.random()>.28,verified:Math.random()>.2}}).sort((a,b)=>parseFloat(a.distance)-parseFloat(b.distance))}
    function renderAuth(mode='login'){destroyMap();const signup=mode==='signup';app.innerHTML=`<main class="min-h-screen flex bg-white"><section class="relative hidden overflow-hidden bg-[#101a30] p-12 text-white lg:flex lg:w-[48%] lg:flex-col lg:justify-between"><div class="absolute -right-28 -top-16 h-[520px] w-[520px] rounded-full border border-white/10"></div><div class="absolute -right-8 top-12 h-[370px] w-[370px] rounded-full border border-white/10"></div><div class="absolute -bottom-28 -left-20 h-80 w-80 rounded-full bg-blue-600/20 blur-3xl"></div><a class="brand relative z-10 flex items-center gap-3 text-xl font-extrabold tracking-tight" href="#"><span class="grid h-10 w-10 place-items-center rounded-xl bg-blue-500 text-xl">⌖</span>nearwise<span class="ml-1 rounded-md border border-white/20 px-2 py-1 text-[9px] font-bold uppercase tracking-[.18em] text-blue-200">LOCAL</span></a><div class="relative z-10 max-w-xl"><p class="mb-5 text-xs font-bold uppercase tracking-[.24em] text-blue-300">Your neighborhood, made easier</p><h1 class="text-5xl font-extrabold leading-[1.12] tracking-tight xl:text-6xl">Good help is<br>closer than you<br><span class="text-blue-400">think.</span></h1><p class="mt-6 max-w-md text-base leading-7 text-slate-300">Meet trusted local professionals, compare your options, and get where you need to go — all in one place.</p><div class="mt-10 flex items-center gap-4"><div class="flex -space-x-3">${['AM','RK','PS','+'].map((x,i)=>`<span class="grid h-10 w-10 place-items-center rounded-full border-2 border-[#101a30] ${i===3?'bg-blue-500':'bg-slate-600'} text-xs font-bold">${x}</span>`).join('')}</div><p class="text-xs text-slate-300"><b class="text-white">2,400+</b> neighbors found their pro this week</p></div></div><p class="relative z-10 text-xs text-slate-500">© 2026 Nearwise. Local connections, made simple.</p></section><section class="flex min-h-screen flex-1 items-center justify-center px-6 py-12"><div class="w-full max-w-[440px] enter"><a class="brand mb-10 flex items-center gap-2 text-lg font-extrabold lg:hidden" href="#"><span class="grid h-9 w-9 place-items-center rounded-xl bg-blue-600 text-white">⌖</span>nearwise</a><div class="mb-8"><span class="mb-4 inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-50 text-xl text-blue-600">${signup?'✦':'↗'}</span><h2 class="text-3xl font-extrabold tracking-tight text-slate-900">${signup?'Find your people.':'Welcome back.'}</h2><p class="mt-2 text-sm text-slate-500">${signup?'Create an account and find trusted help nearby.':'Sign in to pick up where you left off.'}</p></div><form id="auth-form" class="space-y-4" novalidate>${signup?`<label class="block text-sm font-semibold text-slate-700">Full name<input name="name" autocomplete="name" required minlength="2" placeholder="e.g. Aisha Kapoor" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></label>`:''}<label class="block text-sm font-semibold text-slate-700">Email address<input name="email" type="email" autocomplete="email" required placeholder="you@example.com" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></label><label class="block text-sm font-semibold text-slate-700">Password<input name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" required minlength="6" placeholder="${signup?'At least 6 characters':'Enter your password'}" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></label>${signup?`<div><label class="block text-sm font-semibold text-slate-700">Home location</label><div class="mt-2 flex gap-2"><select name="city" required class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-blue-500">${Object.entries(locations).map(([state,items])=>`<optgroup label="${state}">${Object.keys(items).map(c=>`<option>${c}</option>`).join('')}</optgroup>`).join('')}</select><button type="button" id="auth-geolocate" title="Auto-detect my location" class="shrink-0 rounded-xl border border-blue-200 bg-blue-50 px-3 text-lg text-blue-700 hover:bg-blue-100">◎</button></div><p id="auth-gps-status" class="mt-1 text-[11px] text-slate-400">Choose a city or detect your current location.</p></div>`:''}<button class="mt-2 flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700 hover:shadow-blue-600/30 active:scale-[.99]" type="submit">${signup?'Create your account':'Sign in'} <span>→</span></button></form><p class="mt-6 text-center text-sm text-slate-500">${signup?'Already have an account?':'New to Nearwise?'} <button id="auth-switch" class="font-bold text-blue-600 hover:text-blue-700">${signup?'Sign in':'Create an account'}</button></p><div class="mt-8 flex items-center justify-center gap-2 text-xs text-slate-400">${icon('shield','text-emerald-500')} Your information stays on this device</div></div></section></main>`;
      document.getElementById('auth-switch').onclick=()=>renderAuth(signup?'login':'signup');if(signup)document.getElementById('auth-geolocate').onclick=()=>detectLocation((coords)=>{pendingCoords=coords;document.getElementById('auth-gps-status').textContent='GPS location saved for your home map.';toast('Your GPS location is ready to use.','success')});document.getElementById('auth-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));if(signup){const name=String(f.get('name')).trim(),city=String(f.get('city'));if(name.length<2||password.length<6){toast('Please complete all fields. Password needs 6 characters.','error');return}if(db.users.some(u=>u.email===email)){toast('An account with this email already exists.','error');return}const user={name,email,password,city,coords:pendingCoords||undefined,locationLabel:pendingCoords?'Current GPS location':undefined,createdAt:new Date().toISOString()};db.users.push(user);db.session=email;currentUser=user;pendingCoords=null;saveStore();toast(`Welcome to Nearwise, ${name.split(' ')[0]}!`);renderDashboard()}else{const user=db.users.find(u=>u.email===email&&u.password===password);if(!user){toast('Email or password doesn’t match. Try again.','error');return}db.session=email;currentUser=user;saveStore();toast(`Welcome back, ${user.name.split(' ')[0]}!`);renderDashboard()}};
    }
    function renderDashboard(){if(!currentUser){currentUser=db.users.find(u=>u.email===db.session)||null}if(!currentUser){db.session=null;saveStore();renderAuth();return}destroyMap();app.innerHTML=`<div class="min-h-screen bg-[#f4f7fb]"><header class="sticky top-0 z-[1000] border-b border-slate-200/80 bg-white/90 backdrop-blur-xl"><div class="mx-auto flex h-[72px] max-w-[1600px] items-center justify-between px-4 sm:px-6 xl:px-9"><a class="brand flex items-center gap-2.5 text-lg font-extrabold tracking-tight text-slate-900" href="#"><span class="grid h-9 w-9 place-items-center rounded-xl bg-blue-600 text-lg text-white shadow-lg shadow-blue-600/20">⌖</span>nearwise</a><div class="hidden items-center gap-2 rounded-xl bg-slate-50 px-3 py-2 text-sm text-slate-600 ring-1 ring-slate-200 md:flex">${icon('pin','text-blue-600')}<span>Near</span><b class="text-slate-900">${escapeHtml(locationLabel(currentUser))}</b><button id="location-change" class="ml-1 text-xs font-bold text-blue-600 hover:underline">Change</button></div><div class="relative flex items-center gap-3"><button id="profile-trigger" class="flex items-center gap-2 rounded-full p-1 pr-2 transition hover:bg-slate-100"><span class="grid h-9 w-9 place-items-center rounded-full bg-blue-100 text-xs font-extrabold text-blue-700">${escapeHtml(currentUser.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}</span><span class="hidden text-left sm:block"><span class="block text-xs font-bold text-slate-800">${escapeHtml(currentUser.name)}</span><span class="block text-[10px] text-slate-500">Home account</span></span><span class="text-xs text-slate-400">⌄</span></button><div id="profile-menu" class="absolute right-0 top-12 hidden w-60 rounded-2xl border border-slate-100 bg-white p-2 shadow-xl shadow-slate-900/10"><div class="border-b border-slate-100 px-3 py-3"><p class="text-sm font-bold text-slate-900">${escapeHtml(currentUser.name)}</p><p class="mt-1 truncate text-xs text-slate-500">${escapeHtml(currentUser.email)}</p></div><button id="export-data" class="mt-1 flex w-full items-center gap-2 rounded-xl px-3 py-2.5 text-left text-sm font-semibold text-slate-700 hover:bg-slate-50">⇩ <span>Export my data</span></button><button id="logout" class="flex w-full items-center gap-2 rounded-xl px-3 py-2.5 text-left text-sm font-semibold text-rose-600 hover:bg-rose-50">↪ <span>Sign out</span></button><p class="px-3 pb-2 pt-1 text-[10px] leading-4 text-slate-400">Includes account credentials and saved app state.</p></div></div></div></header><main class="mx-auto max-w-[1600px] px-4 pb-10 pt-7 sm:px-6 xl:px-9"><div class="mb-6 flex flex-col justify-between gap-5 lg:flex-row lg:items-end"><div><p class="mb-2 text-xs font-bold uppercase tracking-[.18em] text-blue-600">${new Intl.DateTimeFormat('en',{weekday:'long',month:'long',day:'numeric'}).format(new Date())}</p><h1 class="text-3xl font-extrabold tracking-tight text-slate-900 sm:text-[34px]">Find the right <span class="text-blue-600">local pro.</span></h1><p class="mt-2 text-sm text-slate-500">Great people, right around the corner.</p></div><label class="relative block w-full lg:max-w-[360px]"><span class="absolute left-4 top-1/2 -translate-y-1/2 text-xl text-slate-400">⌕</span><input id="search-input" placeholder="Search by name or specialty..." class="w-full rounded-2xl border-0 bg-white py-3.5 pl-12 pr-4 text-sm shadow-sm ring-1 ring-slate-200 outline-none transition placeholder:text-slate-400 focus:ring-2 focus:ring-blue-500"></label></div><div class="mb-6 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5">${categories.map((c,i)=>`<button data-category="${c.id}" class="category-card enter group flex items-center gap-3 rounded-2xl border ${c.id===activeCategory?'border-blue-500 bg-blue-50/60 shadow-sm shadow-blue-100':'border-slate-200 bg-white hover:border-blue-200 hover:shadow-md'} px-3 py-3.5 text-left transition sm:px-4" style="animation-delay:${i*35}ms"><span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl ${c. me</span></div></section></div><footer class="mt-8 flex flex-col justify-between gap-2 border-t border-slate-200 py-5 text-[11px] text-slate-400 sm:flex-row"><span>Nearwise helps your neighborhood thrive.</span><span>Map data © OpenStreetMap contributors · Demo professionals</span></footer></main><div id="detail-overlay" class="pointer-events-none fixed inset-0 z-[1200]"></div><div id="location-modal" class="fixed inset-0 z-[1400] hidden items-center justify-center bg-slate-950/40 p-4 backdrop-blur-sm"><div class="w-full max-w-sm rounded-3xl bg-white p-6 shadow-2xl"><button id="location-close" class="float-right text-slate-400 hover:text-slate-700">✕</button><p class="text-xs font-bold uppercase tracking-widest text-blue-600">Your neighborhood</p><h3 class="mt-2 text-xl font-extrabold text-slate-900">Change your location</h3><div class="mt-5 flex gap-2"><select id="location-select" class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-blue-500">${Object.entries(locations).map(([state,items])=>`<optgroup label="${state}">${Object.keys(items).map(c=>`<option ${currentUser.city===c?'selected':''}>${c}</option>`).join('')}</optgroup>`).join('')}</select><button id="modal-geolocate" title="Auto-detect my location" class="rounded-xl border border-blue-200 bg-blue-50 px-3 text-lg text-blue-700 hover:bg-blue-100">GPS</button></div><p id="modal-gps-status" class="mt-2 text-[11px] text-slate-400">GPS: use your current device location</p><button id="location-save" class="mt-4 w-full rounded-xl bg-blue-600 py-3 text-sm font-bold text-white hover:bg-blue-700">Update location</button></div></div></div>`;
      document.querySelectorAll('[data-category]').forEach(btn=>btn.onclick=()=>selectCategory(btn.dataset.category));document.getElementById('profile-trigger').onclick=()=>document.getElementById('profile-menu').classList.toggle('hidden');document.getElementById('export-data').onclick=exportData;document.getElementById('logout').onclick=()=>{db.session=null;currentUser=null;saveStore();renderAuth();toast('You have signed out.','info')};document.getElementById('location-change').onclick=openLocationModal;document.getElementById('location-close').onclick=closeLocationModal;document.getElementById('location-save').onclick=saveLocation;document.getElementById('modal-geolocate').onclick=()=>detectLocation(coords=>applyDetectedLocation(coords,'modal-gps-status'));document.getElementById('search-input').oninput=filterList;document.getElementById('sort-nearest').onclick=()=>{professionals.sort((a,b)=>parseFloat(a.distance)-parseFloat(b.distance));renderList();toast('Showing nearest professionals first.','info')};document.addEventListener('click',outsideProfile,{once:true});renderMap();selectCategory(activeCategory);

    function outsideProfile(e){const trigger=document.getElementById('profile-trigger'),menu=document.getElementById('profile-menu');if(trigger&&menu&&!trigger.contains(e.target)&&!menu.contains(e.target))menu.classList.add('hidden');if(trigger)document.addEventListener('click',outsideProfile,{once:true})}
    function renderMap(){if(!window.L){document.getElementById('map').innerHTML='<div class="grid h-full place-items-center p-8 text-center text-sm text-slate-500">Map tiles could not load. Check your internet connection.</div>';return}const center=homeCoords();map=L.map('map',{zoomControl:false,scrollWheelZoom:true}).setView(center,13);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);homeMarker=L.marker(center,{icon:L.divIcon({className:'',html:'<div class="map-marker home-marker"><span>⌂</span></div>',iconSize:[38,38],iconAnchor:[18,34]})}).addTo(map).bindPopup(`<b>Your home</b><br>${escapeHtml(currentUser.city)}`)}
    function destroyMap(){if(map){map.remove();map=null}markers=[];routeLine=null;homeMarker=null}
    function selectCategory(category){activeCategory=category;const list=document.getElementById('professional-list');if(!list)return;document.querySelectorAll('[data-category]').forEach(b=>{const active=b.dataset.category===category;b.classList.toggle('border-blue-500',active);b.classList.toggle('bg-blue-50/60',active);b.classList.toggle('shadow-sm',active);b.classList.toggle('border-slate-200',!active)});document.querySelector('h2').textContent=`${category}s near you`;list.innerHTML=Array.from({length:4},()=>`<div class="rounded-2xl border border-slate-100 bg-white p-4"><div class="flex gap-3"><div class="skeleton h-12 w-12 rounded-full"></div><div class="flex-1"><div class="skeleton h-4 w-2/5 rounded"></div><div class="skeleton mt-2 h-3 w-3/5 rounded"></div></div></div><div class="skeleton mt-5 h-12 rounded-xl"></div></div>`).join('');document.getElementById('results-count').textContent=`Searching ${currentUser.city}…`;setTimeout(()=>{if(!document.getElementById('professional-list'))return;professionals=getProfessionals(category,currentUser.city);db.searches.unshift({category,city:currentUser.city,at:new Date().toISOString()});db.searches=db.searches.slice(0,30);saveStore();renderList();renderMarkers()},450)}
    function renderList(items=professionals){const list=document.getElementById('professional-list');if(!list)return;document.getElementById('results-count').textContent=`${items.length} trusted ${activeCategory.toLowerCase()}${items.length===1?'':'s'} found nearby`;if(!items.length){list.innerHTML='<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center"><span class="text-3xl">⌕</span><p class="mt-3 font-bold text-slate-700">No matches found</p><p class="mt-1 text-xs text-slate-500">Try a different name or specialty.</p></div>';return}list.innerHTML=items.map((p,i)=>`<article data-pro="${p.id}" class="pro-card enter group cursor-pointer rounded-2xl border ${selectedId===p.id?'border-blue-400 ring-2 ring-blue-100':'border-slate-200'} bg-white p-4 shadow-[0_2px_12px_rgba(15,23,42,.025)] transition hover:-translate-y-0.5 hover:border-blue-200 hover:shadow-lg hover:shadow-slate-900/5" style="animation-delay:${i*35}ms"><div class="flex items-start gap-3.5"><span class="relative grid h-[50px] w-[50px] shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-100 text-sm font-extrabold text-blue-700">${p.initials}<i class="absolute -bottom-1 -right-1 h-3 w-3 rounded-full border-2 border-white ${p.available?'bg-emerald-500':'bg-amber-400'}"></i></span><div class="min-w-0 flex-1"><div class="flex items-center gap-2"><h3 class="truncate text-sm font-extrabold text-slate-900">${escapeHtml(p.name)}</h3>${p.verified?'<span class="shrink-0 rounded-md bg-blue-50 px-1.5 py-0.5 text-[9px] font-bold text-blue-600">VERIFIED</span>':''}</div><p class="mt-1 truncate text-xs text-slate-500">${escapeHtml(p.specialty)}</p><div class="mt-2 flex items-center gap-2 text-[11px]"><span class="font-bold text-amber-500">★ ${p.rating}</span><span class="text-slate-400">(${p.reviews} reviews)</span><span class="text-slate-300">·</span><span class="font-semibold text-slate-600">${p.distance} km away</span></div></div><button data-fav="${p.id}" class="fav-btn grid h-8 w-8 shrink-0 place-items-center rounded-full text-xl ${db.favorites.includes(p.id)?'text-rose-500':'text-slate-300 hover:text-rose-400'}" aria-label="Save ${escapeHtml(p.name)}">${db.favorites.includes(p.id)?'♥':'♡'}</button></div><div class="mt-3.5 flex items-center justify-between border-t border-slate-100 pt-3"><span class="text-xs font-bold text-slate-800">${p.price}<span class="font-normal text-slate-400"> / visit</span></span><span class="flex items-center gap-1 text-[10px] font-semibold ${p.available?'text-emerald-600':'text-amber-600'}"><span class="h-1.5 w-1.5 rounded-full ${p.available?'bg-emerald-500':'bg-amber-400'}"></span>${p.available?'Available today':'Next available tomorrow'}</span><span class="text-xs font-bold text-blue-600 opacity-0 transition group-hover:opacity-100">View profile →</span></div></article>`).join('');list.querySelectorAll('.pro-card').forEach(card=>card.onclick=e=>{if(e.target.closest('.fav-btn'))return;selectProfessional(card.dataset.pro)});list.querySelectorAll('.fav-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFavorite(b.dataset.fav)})}
    function filterList(){const q=document.getElementById('search-input').value.trim().toLowerCase();const filtered=professionals.filter(p=>`${p.name} ${p.specialty} ${p.category}`.toLowerCase().includes(q));renderList(filtered);if(q&&filtered.length===1)focusMarker(filtered[0].id)}
    function renderMarkers(){if(!map)return;markers.forEach(m=>map.removeLayer(m.marker));markers=[];professionals.forEach(p=>{const marker=L.marker(p.coords,{icon:L.divIcon({className:'',html:`<div class="map-marker"><span>${categoryIcons[p.category]}</span></div>`,iconSize:[38,38],iconAnchor:[18,34]})}).addTo(map);marker.bindPopup(`<div style="min-width:145px"><b>${escapeHtml(p.name)}</b><div style="margin-top:3px;color:#64748b;font-size:11px">${escapeHtml(p.specialty)} · ${p.distance} km</div><div style="margin-top:7px;color:#2563eb;font-size:11px;font-weight:700">Click to view profile →</div></div>`);marker.on('click',()=>selectProfessional(p.id));markers.push({id:p.id,marker})})}
    function focusMarker(id){const item=markers.find(x=>x.id===id),pro=professionals.find(x=>x.id===id);if(item&&map){map.flyTo(pro.coords,15,{duration:.6});item.marker.openPopup()}}
    function selectProfessional(id){const p=professionals.find(x=>x.id===id);if(!p)return;selectedId=id;renderList();const box=document.getElementById('detail-overlay');box.className='pointer-events-auto fixed inset-0 z-[1200]';box.innerHTML=`<button id="detail-backdrop" class="absolute inset-0 bg-slate-950/25 backdrop-blur-[2px]" aria-label="Close profile"></button><aside class="enter absolute bottom-0 right-0 flex max-h-[90vh] w-full flex-col overflow-y-auto rounded-t-[28px] bg-white shadow-2xl sm:bottom-4 sm:right-4 sm:max-h-[calc(100vh-32px)] sm:w-[390px] sm:rounded-[28px]"><div class="relative h-32 shrink-0 overflow-hidden bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-700"><div class="absolute -right-8 -top-16 h-52 w-52 rounded-full border border-white/20"></div><div class="absolute right-14 top-10 h-28 w-28 rounded-full border border-white/15"></div><button id="detail-close" class="absolute right-4 top-4 grid h-9 w-9 place-items-center rounded-full bg-white/15 text-white backdrop-blur hover:bg-white/25">✕</button><span class="absolute bottom-3 left-5 rounded-lg bg-white/15 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-white backdrop-blur">${escapeHtml(p.category)} · Local pro</span></div><div class="px-5 pb-5"><div class="-mt-8 flex items-end justify-between"><span class="grid h-[68px] w-[68px] place-items-center rounded-[22px] border-4 border-white bg-blue-100 text-xl font-extrabold text-blue-700 shadow-md">${p.initials}</span><button id="detail-fav" class="mb-1 flex h-9 items-center gap-2 rounded-full border border-slate-200 px-3 text-xs font-bold text-slate-600 hover:border-rose-200 hover:text-rose-500">${db.favorites.includes(p.id)?'♥ Saved':'♡ Save'}</button></div><h2 class="mt-3 text-2xl font-extrabold tracking-tight text-slate-900">${escapeHtml(p.name)}</h2><p class="mt-1 text-sm text-slate-500">${escapeHtml(p.specialty)}</p><div class="mt-4 flex flex-wrap gap-2"><span class="rounded-lg bg-amber-50 px-2.5 py-1.5 text-xs font-bold text-amber-700">★ ${p.rating} <span class="font-medium text-amber-600">(${p.reviews})</span></span><span class="rounded-lg bg-blue-50 px-2.5 py-1.5 text-xs font-bold text-blue-700">⌖ ${p.distance} km away</span><span class="rounded-lg bg-emerald-50 px-2.5 py-1.5 text-xs font-bold text-emerald-700">${p.available?'● Available today':'◷ Available tomorrow'}</span></div><div class="my-5 grid grid-cols-2 gap-3"><div class="rounded-2xl bg-slate-50 p-3.5"><p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Starting at</p><p class="mt-1 text-lg font-extrabold text-slate-900">${p.price}<span class="text-xs font-medium text-slate-500"> / visit</span></p></div><div class="rounded-2xl bg-slate-50 p-3.5"><p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Experience</p><p class="mt-1 text-lg font-extrabold text-slate-900">${3+(p.reviews%12)}+ <span class="text-xs font-medium text-slate-500">years</span></p></div></div><div class="rounded-2xl border border-slate-100 p-4"><p class="text-xs font-bold text-slate-800">About this professional</p><p class="mt-2 text-xs leading-5 text-slate-500">${escapeHtml(p.name.split(' ')[0])} is a highly rated ${escapeHtml(p.specialty.toLowerCase())} serving ${escapeHtml(currentUser.city)}. A trusted choice among local neighbors, with ${p.reviews} reviews on Nearwise.</p></div><button id="route-button" class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 py-3.5 text-sm font-extrabold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700 active:scale-[.99]">⌖ <span>Start navigation</span> <span class="ml-auto text-lg">→</span></button><p class="mt-3 text-center text-[10px] text-slate-400">Route from your home in ${escapeHtml(currentUser.city)} · Map data by OpenStreetMap</p></div></aside>`;document.getElementById('detail-close').onclick=closeDetail;document.getElementById('detail-backdrop').onclick=closeDetail;document.getElementById('detail-fav').onclick=()=>{toggleFavorite(p.id);if(document.getElementById('detail-fav'))document.getElementById('detail-fav').innerHTML=db.favorites.includes(p.id)?'♥ Saved':'♡ Save'};document.getElementById('route-button').onclick=()=>startRoute(p);focusMarker(id)}
    function closeDetail(){const box=document.getElementById('detail-overlay');if(!box)return;box.className='pointer-events-none fixed inset-0 z-[1200]';box.innerHTML='';selectedId=null;renderList()}
    function startRoute(p){if(!map)return;const start=homeCoords();if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline([start,p.coords],{color:'#2563eb',weight:5,opacity:.9,dashArray:'10 8',lineCap:'round'}).addTo(map);map.fitBounds(L.latLngBounds([start,p.coords]),{padding:[80,80],maxZoom:14,duration:.7});routeLine.bindPopup(`<b>Route to ${escapeHtml(p.name)}</b><br>${p.distance} km from your home`).openPopup();toast(`Route ready: ${p.distance} km to ${p.name}.`)}
    function toggleFavorite(id){const i=db.favorites.indexOf(id);if(i>=0){db.favorites.splice(i,1);toast('Removed from your saved professionals.','info')}else{db.favorites.push(id);toast('Professional saved to your favorites.')}saveStore();renderList()}
    function exportData(){const payload={product:'Nearwise',exportedAt:new Date().toISOString(),account:{name:currentUser.name,email:currentUser.email,password:currentUser.password,homeLocation:currentUser.city,createdAt:currentUser.createdAt},applicationState:{favorites:db.favorites,searchHistory:db.searches,session:db.session}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='auth_config.json';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);document.getElementById('profile-menu').classList.add('hidden');toast('Your data export is ready.','info')}
    function detectLocation(onSuccess){if(!navigator.geolocation){toast('This browser does not support location detection.','error');return}toast('Requesting your location permission…','info');navigator.geolocation.getCurrentPosition(position=>onSuccess([position.coords.latitude,position.coords.longitude]),error=>{const messages={1:'Location permission was denied. You can allow it in your browser settings.',2:'Your current location could not be determined.',3:'Location request timed out. Please try again.'};toast(messages[error.code]||'Unable to detect your location.','error')},{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
    function applyDetectedLocation(coords,statusId){currentUser.coords=coords;currentUser.locationLabel='Current GPS location';db.users=db.users.map(u=>u.email===currentUser.email?currentUser:u);saveStore();const status=document.getElementById(statusId);if(status)status.textContent=`GPS ready: ${coords[0].toFixed(4)}, ${coords[1].toFixed(4)}`;if(map){map.setView(coords,14,{animate:true});if(homeMarker)homeMarker.setLatLng(coords);if(routeLine){map.removeLayer(routeLine);routeLine=null}professionals=getProfessionals(activeCategory,currentUser.city);renderList();renderMarkers()}toast('Map and nearby professionals updated to your GPS location.')}
    function openLocationModal(){document.getElementById('location-modal').classList.remove('hidden');document.getElementById('location-modal').classList.add('flex')}
    function closeLocationModal(){const modal=document.getElementById('location-modal');modal.classList.add('hidden');modal.classList.remove('flex')}
    function saveLocation(){const city=document.getElementById('location-select').value;if(city===currentUser.city&&!currentUser.coords){closeLocationModal();return}currentUser.city=city;currentUser.coords=null;currentUser.locationLabel=null;db.users=db.users.map(u=>u.email===currentUser.email?currentUser:u);saveStore();activeCategory='Doctor';toast(`Location updated to ${city}.`);renderDashboard()}
    // Restore an authenticated session from the simulated backend.
